# What a customer adds to their repo. This is the whole onboarding.
name: bumpfix

on:
  pull_request:
    paths:
      - "requirements*.txt"
      - "**/requirements*.txt"
      - pyproject.toml
      - "**/pyproject.toml"
      - poetry.lock
      - "**/poetry.lock"
      - uv.lock
      - "**/uv.lock"
      - Pipfile
      - "**/Pipfile"
      - Pipfile.lock
      - "**/Pipfile.lock"
      - setup.py
      - setup.cfg

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    # Same-repo PRs only (Dependabot included): on fork PRs the head_ref
    # checkout below would fail — the fork's branch doesn't exist here — and
    # secrets aren't available to fork PRs anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR branch itself (not the merge ref) so bumpfix
          # can push the verified fix onto this PR.
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # Your normal install step — bumpfix reuses the environment your CI
      # already knows how to build.
      - run: pip install -r requirements.txt pytest

      - uses: Shridhar2104/bumpfix@v1
        env:
          # For Dependabot PRs this must also be added under
          # Settings → Secrets → Dependabot.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
