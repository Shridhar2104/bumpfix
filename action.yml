name: greenbump
description: >
  When a dependency's major-version bump breaks your build, fix the code.
  Runs in your own CI, verifies against your existing tests, and stays silent
  unless the suite actually passes.
author: greenbump

branding:
  icon: check-circle
  color: green

inputs:
  library:
    description: Package whose major version changed, e.g. pydantic
    required: true
  from-version:
    description: Version being upgraded from (improves accuracy)
    required: false
  to-version:
    description: Version being upgraded to (improves accuracy)
    required: false
  python:
    description: Interpreter that has the project's dependencies installed
    required: false
    default: python
  working-directory:
    description: Directory to run in
    required: false
    default: ${{ github.workspace }}
  max-cost-usd:
    description: Hard ceiling on spend for this attempt. The run is abandoned rather than exceeding it.
    required: false
    default: "3"
  max-turns:
    description: Maximum agent turns before giving up
    required: false
    default: "40"
  branch:
    description: Branch to push the verified fix to. Defaults to a generated name.
    required: false
  github-token:
    description: Token used to push the fix branch. Needs contents:write.
    required: false
    default: ${{ github.token }}

runs:
  using: node20
  main: dist/action.js
