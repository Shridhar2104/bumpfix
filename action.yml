name: bumpfix
description: >
  When a dependency's major-version bump breaks your build, fix the code.
  Runs in your own CI, verifies against your existing tests, and stays silent
  unless the suite actually passes.
author: bumpfix

branding:
  icon: check-circle
  color: green

inputs:
  library:
    description: >
      Override auto-detection and fix this package regardless of the PR diff.
      By default bumpfix reads the PR's manifest changes and finds
      major-version bumps itself.
    required: false
  from-version:
    description: Version being upgraded from (only with `library`; improves accuracy)
    required: false
  to-version:
    description: Version being upgraded to (only with `library`; improves accuracy)
    required: false
  python:
    description: Interpreter that has the project's dependencies installed
    required: false
    default: python
  working-directory:
    description: Directory to run in
    required: false
    default: ${{ github.workspace }}
  max-cost-usd:
    description: Hard ceiling on spend for this run, shared across all detected bumps. The run is abandoned rather than exceeding it.
    required: false
    default: "3"
  max-turns:
    description: Maximum agent turns per attempt before giving up
    required: false
    default: "40"
  branch:
    description: Fallback branch for the fix when pushing to the PR branch is not possible. Defaults to a generated name.
    required: false
  github-token:
    description: Token used to push the fix and comment on the PR. Needs contents:write and pull-requests:write.
    required: false
    default: ${{ github.token }}

outputs:
  outcome-file:
    description: Path to a JSON record of everything bumpfix did this run.
  fixed:
    description: '"true" when a verified fix was committed.'

runs:
  using: node20
  main: dist/action.js
